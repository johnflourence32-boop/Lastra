<!DOCTYPE html>
<html lang="en">

<head>
<script src="theme.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Games</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* Header stays put while the grid scrolls underneath, so search is always in reach */
    .bar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px 16px;
      padding: 14px 24px;
      background: rgba(28, 16, 32, 0.72);
      background: color-mix(in srgb, var(--bg) 72%, transparent);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .search {
      flex: 1 1 260px;
      max-width: 460px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      transition: border-color 0.15s;
    }

    .search:focus-within {
      border-color: var(--border-light);
    }

    .search i {
      color: var(--text-muted);
      font-size: 14px;
    }

    .search input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font: inherit;
      font-size: 14px;
    }

    .search input::placeholder {
      color: var(--text-dim);
    }

    .count {
      margin-left: auto;
      font-size: 13px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    main {
      max-width: 1240px;
      margin: 0 auto;
      padding: 20px 24px 56px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(116px, 1fr));
      gap: 14px;
    }

    .game {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      min-width: 0;
      padding: 12px 8px 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font: inherit;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.15s;
    }

    .game:hover {
      background: var(--surface-hover);
      border-color: var(--border-light);
      transform: translateY(-2px);
    }

    .game:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* No artwork in the list, so each game gets a letter tile in its own steady hue */
    .tile {
      width: 64px;
      height: 64px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 26px;
      font-weight: 600;
      background: hsl(var(--h) 32% 26%);
      color: hsl(var(--h) 75% 86%);
    }

    .name {
      width: 100%;
      font-size: 12px;
      line-height: 1.3;
      text-align: center;
      color: var(--text-muted);
      overflow: hidden;
      overflow-wrap: anywhere;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .game:hover .name {
      color: var(--text);
    }

    .empty {
      padding: 72px 16px;
      text-align: center;
    }

    .empty p:first-child {
      font-size: 15px;
      font-weight: 500;
    }

    .empty p + p {
      margin-top: 6px;
      font-size: 13px;
      color: var(--text-muted);
    }

    @media (max-width: 520px) {
      .bar { padding: 12px 16px; }
      main { padding: 16px 16px 48px; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
      .tile { width: 56px; height: 56px; font-size: 22px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .game { transition: none; }
      .game:hover { transform: none; }
    }

    #wp{position:fixed;inset:0;z-index:-1;overflow:hidden}
    #wp>video,#wp>img{width:100%;height:100%;object-fit:cover}
    #wp::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,var(--wp-dim,.25))}
  </style>
</head>

<body>
  <div id="wp"></div>

  <header class="bar">
    <h1>Games</h1>
    <label class="search">
      <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
      <input type="text" id="q" placeholder="Search games" aria-label="Search games" autocomplete="off" spellcheck="false" enterkeyhint="search">
    </label>
    <span class="count" id="count" aria-live="polite"></span>
  </header>

  <main>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden></div>
    <div id="end"></div>
  </main>

  <script>
    const $ = s => document.querySelector(s);
    const grid = $('#grid'), q = $('#q'), count = $('#count'), empty = $('#empty'), end = $('#end');
    const CHUNK = 72;                 // tiles drawn per batch, so a long list opens instantly
    let all = [], list = [], shown = 0;

    // Same message the New Tab page uses; browser.html loads the URL through the proxy
    function open(url) {
      if (window.parent !== window) window.parent.postMessage({ type: 'navigate', url }, '*');
      else location.href = 'browser.html#' + encodeURIComponent(url);
    }

    // FNV-1a plus a final mix, so near-identical names ("Game 1", "Game 2") still get different colors
    const hue = s => {
      let h = 2166136261;
      for (const c of s) { h ^= c.codePointAt(0); h = Math.imul(h, 16777619); }
      h ^= h >>> 15; h = Math.imul(h, 2246822507); h ^= h >>> 13;
      return (h >>> 0) % 360;
    };

    function tile(g) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'game';
      b.dataset.url = g.url;
      b.title = g.name;

      const t = document.createElement('span');
      t.className = 'tile';
      t.style.setProperty('--h', hue(g.name));
      t.textContent = Array.from(g.name)[0].toUpperCase();

      const n = document.createElement('span');
      n.className = 'name';
      n.textContent = g.name;

      b.append(t, n);
      return b;
    }

    function drawMore() {
      const frag = document.createDocumentFragment();
      for (const g of list.slice(shown, shown + CHUNK)) frag.append(tile(g));
      shown = Math.min(shown + CHUNK, list.length);
      grid.append(frag);
    }

    // Keep drawing until the bottom of the grid is a screenful or so past the viewport
    function fill() {
      while (shown < list.length && end.getBoundingClientRect().top < innerHeight + 600) drawMore();
    }

    function message(title, hint) {
      const a = document.createElement('p');
      a.textContent = title;
      empty.replaceChildren(a);
      if (hint) {
        const b = document.createElement('p');
        b.textContent = hint;
        empty.append(b);
      }
      empty.hidden = false;
    }

    function render() {
      const terms = q.value.toLowerCase().split(/\s+/).filter(Boolean);
      list = terms.length ? all.filter(g => terms.every(t => g.key.includes(t))) : all;
      shown = 0;
      grid.replaceChildren();
      empty.hidden = true;
      scrollTo(0, 0);

      const n = all.length.toLocaleString();
      count.textContent = terms.length ? `${list.length.toLocaleString()} of ${n}` : `${n} ${all.length === 1 ? 'game' : 'games'}`;

      if (!all.length) message('No games yet.', 'Add entries to games.json and they will show up here.');
      else if (!list.length) message(`No games match \u201C${q.value.trim()}\u201D.`);
      fill();
    }

    grid.addEventListener('click', e => {
      const b = e.target.closest('.game');
      if (b) open(b.dataset.url);
    });
    addEventListener('scroll', fill, { passive: true });
    addEventListener('resize', fill);
    q.addEventListener('input', render);
    q.addEventListener('keydown', e => {
      if (e.key === 'Escape' && q.value) { q.value = ''; render(); }
    });

    fetch('games.json')
      .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
      .then(data => {
        all = (Array.isArray(data) ? data : [])
          .filter(g => g && typeof g.name === 'string' && g.name.trim() && /^https?:\/\//i.test(g.url))
          .map(g => ({ name: g.name.trim(), url: g.url.trim(), key: g.name.trim().toLowerCase() }))
          .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));
        render();
      })
      .catch(() => {
        count.textContent = '';
        message('Couldn\u2019t load the games list.', 'Refresh this tab to try again.');
      });

    if (matchMedia('(pointer: fine)').matches) q.focus({ preventScroll: true });
  </script>
  <script>LastraTheme.mount(document.getElementById("wp"))</script>
</body>

</html>
